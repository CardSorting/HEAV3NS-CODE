name: LUMI Repository Protection & Performance Guardrail CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  agent-flight-test:
    name: Agent Flight Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js Runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Agent Flight Test
        timeout-minutes: 2
        run: npm run benchmark:flight -- --output agent-flight-test-report.json

      - name: Upload machine-readable report
        if: ${{ always() && hashFiles('agent-flight-test-report.json') != '' }}
        id: upload-report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agent-flight-test-report-node-${{ matrix.node }}-${{ github.sha }}
          path: agent-flight-test-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Add result to workflow summary
        if: ${{ always() && hashFiles('agent-flight-test-report.json') != '' }}
        env:
          FLIGHT_REPORT_ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: node scripts/write-agent-flight-summary.mjs agent-flight-test-report.json

  guardrail-protection-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js Runtime (v22.12+)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify DCO sign-offs
        env:
          DCO_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/check-dco.mjs --range "$DCO_RANGE"

      - name: Run licensing, IP, and package-boundary checks
        run: npm run legal:check

      - name: Run TypeScript type checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run repository tests
        run: npm test
