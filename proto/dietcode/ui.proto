syntax = "proto3";

package dietcode;

import "dietcode/common.proto";

option go_package = "github.com/dietcode/grpc-go/dietcode";
option java_multiple_files = true;
option java_package = "bot.dietcode.proto";

// Enum for DietCodeMessage type
enum DietCodeMessageType {
  ASK = 0;
  SAY = 1;
}

// Enum for DietCodeAsk types
enum DietCodeAsk {
  FOLLOWUP = 0;
  PLAN_MODE_RESPOND = 1;
  COMMAND = 2;
  COMMAND_OUTPUT = 3;
  COMPLETION_RESULT = 4;
  TOOL = 5;
  API_REQ_FAILED = 6;
  RESUME_TASK = 7;
  RESUME_COMPLETED_TASK = 8;
  MISTAKE_LIMIT_REACHED = 9;
  BROWSER_ACTION_LAUNCH = 10;
  USE_MCP_SERVER = 11;
  NEW_TASK = 12;
  CONDENSE = 13;
  REPORT_BUG = 14;
  SUMMARIZE_TASK = 15;
  ACT_MODE_RESPOND = 16;
  reserved 17; // was USE_SUBAGENTS
}

// Enum for DietCodeSay types
enum DietCodeSay {
  TASK = 0;
  ERROR = 1;
  API_REQ_STARTED = 2;
  API_REQ_FINISHED = 3;
  TEXT = 4;
  REASONING = 5;
  COMPLETION_RESULT_SAY = 6;
  USER_FEEDBACK = 7;
  USER_FEEDBACK_DIFF = 8;
  API_REQ_RETRIED = 9;
  COMMAND_SAY = 10;
  COMMAND_OUTPUT_SAY = 11;
  TOOL_SAY = 12;
  SHELL_INTEGRATION_WARNING = 13;
  BROWSER_ACTION_LAUNCH_SAY = 14;
  BROWSER_ACTION = 15;
  BROWSER_ACTION_RESULT = 16;
  MCP_SERVER_REQUEST_STARTED = 17;
  MCP_SERVER_RESPONSE = 18;
  MCP_NOTIFICATION = 19;
  USE_MCP_SERVER_SAY = 20;
  DIFF_ERROR = 21;
  DELETED_API_REQS = 22;
  DIETCODEIGNORE_ERROR = 23;
  CHECKPOINT_CREATED = 24;
  LOAD_MCP_DOCUMENTATION = 25;
  INFO = 26;
  TASK_PROGRESS = 27;
  ERROR_RETRY = 28;
  GENERATE_EXPLANATION = 29;
  HOOK_STATUS = 30;
  HOOK_OUTPUT_STREAM = 31;
  COMMAND_PERMISSION_DENIED = 32;
  CONDITIONAL_RULES_APPLIED = 33;
  reserved 34, 35, 36; // was SUBAGENT_STATUS, USE_SUBAGENTS_SAY, SUBAGENT_USAGE
  PLAN_SUMMARY = 37;
}

// Enum for DietCodeSayTool tool types
enum DietCodeSayToolType {
  EDITED_EXISTING_FILE = 0;
  NEW_FILE_CREATED = 1;
  READ_FILE = 2;
  LIST_FILES_TOP_LEVEL = 3;
  LIST_FILES_RECURSIVE = 4;
  LIST_CODE_DEFINITION_NAMES = 5;
  SEARCH_FILES = 6;
  WEB_FETCH = 7;
  FILE_DELETED = 8;
}

// Enum for browser actions
enum BrowserAction {
  LAUNCH = 0;
  CLICK = 1;
  TYPE = 2;
  SCROLL_DOWN = 3;
  SCROLL_UP = 4;
  CLOSE = 5;
}

// Enum for MCP server request types
enum McpServerRequestType {
  USE_MCP_TOOL = 0;
  ACCESS_MCP_RESOURCE = 1;
}

// Enum for API request cancel reasons
enum DietCodeApiReqCancelReason {
  STREAMING_FAILED = 0;
  USER_CANCELLED = 1;
  RETRIES_EXHAUSTED = 2;
}

// Message for conversation history deleted range
message ConversationHistoryDeletedRange {
  int32 start_index = 1;
  int32 end_index = 2;
}

// Message for DietCodeSayTool
message DietCodeSayTool {
  DietCodeSayToolType tool = 1;
  string path = 2;
  string diff = 3;
  string content = 4;
  string regex = 5;
  string file_pattern = 6;
  bool operation_is_located_in_workspace = 7;
}

// Message for DietCodeSayBrowserAction
message DietCodeSayBrowserAction {
  BrowserAction action = 1;
  string coordinate = 2;
  string text = 3;
}

// Message for BrowserActionResult
message BrowserActionResult {
  string screenshot = 1;
  string logs = 2;
  string current_url = 3;
  string current_mouse_position = 4;
}

// Message for DietCodeAskUseMcpServer
message DietCodeAskUseMcpServer {
  string server_name = 1;
  McpServerRequestType type = 2;
  string tool_name = 3;
  string arguments = 4;
  string uri = 5;
}

// Message for DietCodePlanModeResponse
message DietCodePlanModeResponse {
  string response = 1;
  repeated string options = 2;
  string selected = 3;
}

// Message for DietCodeAskQuestion
message DietCodeAskQuestion {
  string question = 1;
  repeated string options = 2;
  string selected = 3;
}

// Message for DietCodeAskNewTask
message DietCodeAskNewTask {
  string context = 1;
}

// Message for API request retry status
message ApiReqRetryStatus {
  int32 attempt = 1;
  int32 max_attempts = 2;
  int32 delay_sec = 3;
  string error_snippet = 4;
}

// Message for DietCodeApiReqInfo
message DietCodeApiReqInfo {
  string request = 1;
  int32 tokens_in = 2;
  int32 tokens_out = 3;
  int32 cache_writes = 4;
  int32 cache_reads = 5;
  double cost = 6;
  DietCodeApiReqCancelReason cancel_reason = 7;
  string streaming_failed_message = 8;
  ApiReqRetryStatus retry_status = 9;
}

message DietCodeModelInfo {
  string provider_id = 1;
  string model_id = 2;
}

// Main DietCodeMessage type
message DietCodeMessage {
  int64 ts = 1;
  DietCodeMessageType type = 2;
  DietCodeAsk ask = 3;
  DietCodeSay say = 4;
  string text = 5;
  string reasoning = 6;
  repeated string images = 7;
  repeated string files = 8;
  bool partial = 9;
  string last_checkpoint_hash = 10;
  bool is_checkpoint_checked_out = 11;
  bool is_operation_outside_workspace = 12;
  int32 conversation_history_index = 13;
  ConversationHistoryDeletedRange conversation_history_deleted_range = 14;

  // Additional fields for specific ask/say types
  DietCodeSayTool say_tool = 15;
  DietCodeSayBrowserAction say_browser_action = 16;
  BrowserActionResult browser_action_result = 17;
  DietCodeAskUseMcpServer ask_use_mcp_server = 18;
  DietCodePlanModeResponse plan_mode_response = 19;
  DietCodeAskQuestion ask_question = 20;
  DietCodeAskNewTask ask_new_task = 21;
  DietCodeApiReqInfo api_req_info = 22;
  DietCodeModelInfo model_info = 23;
  TaskAuditMetadataProto audit_metadata = 24;
}

// Message for TaskAuditMetadata
message TaskAuditMetadataProto {
  repeated string joy_zoning_violations = 1;
  string result_checksum = 2;
  bool divergence_detected = 3;
  double entropy_score = 4;
  repeated string violations = 5;
  string intent_classification = 6;
  double intent_coverage = 7;
  int64 audited_at = 8;
  double hardening_score = 9;
  string hardening_grade = 10;
  bool gate_blocked = 11;
  int32 gate_block_count = 12;
  repeated string gate_reason_codes = 13;
  double gate_effective_threshold = 14;
  string artifact_sarif_path = 15;
  string artifact_report_path = 16;
  string artifact_manifest_path = 17;
  repeated string suppressed_violations = 18;
  bool workspace_gate_policy_applied = 19;
}

message ShowWebviewEvent {
  bool preserve_editor_focus = 1; // When true, webview should not steal focus from editor
}

// UiService provides methods for managing UI interactions
service UiService {
  // Scrolls to a specific settings section in the settings view
  rpc scrollToSettings(StringRequest) returns (KeyValuePair);

  // Marks the current announcement as shown and returns whether an announcement should still be shown
  rpc onDidShowAnnouncement(EmptyRequest) returns (Boolean);

  // Subscribe to addToInput events (when user adds content via context menu)
  rpc subscribeToAddToInput(EmptyRequest) returns (stream String);

  // Subscribe to MCP button clicked events
  rpc subscribeToMcpButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to history button click events
  rpc subscribeToHistoryButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to chat button clicked events (when the chat button is clicked in VSCode)
  rpc subscribeToChatButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to account button click events
  rpc subscribeToAccountButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to settings button clicked events
  rpc subscribeToSettingsButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to worktrees button clicked events
  rpc subscribeToWorktreesButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to joy zoning button clicked events
  rpc subscribeToJoyZoningButtonClicked(EmptyRequest) returns (stream Empty);

  // Subscribe to partial message updates (streaming DietCode messages as they're built)
  rpc subscribeToPartialMessage(EmptyRequest) returns (stream DietCodeMessage);

  // Initialize webview when it launches
  rpc initializeWebview(EmptyRequest) returns (Empty);

  // Subscribe to relinquish control events
  rpc subscribeToRelinquishControl(EmptyRequest) returns (stream Empty);

  // Subscribe to show webview events
  rpc subscribeToShowWebview(EmptyRequest) returns (stream ShowWebviewEvent);

  // Opens a URL in the default browser
  rpc openUrl(StringRequest) returns (Empty);

  // Opens the DietCode walkthrough
  rpc openWalkthrough(EmptyRequest) returns (Empty);

  // Records that a prompt suggestion was clicked
  rpc onSuggestionClicked(StringRequest) returns (Empty);
}
